maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

collections:
  - APSR

languages:
  - r

repo: replicate-anything/rep-10.1017-s0003055421001143

paper:
  doi: https://doi.org/10.1017/S0003055421001143
  title: "Sovereignty, Substance, and Public Support for European Courts' Human Rights Rulings"
  authors:
    - Madsen, Mikael Rask
    - Mayoral, Juan
    - Strezhnev, Anton
    - Voeten, Erik
  journal: American Political Science Review
  year: 2021
  study_folder: rep-10.1017-s0003055421001143
  dependencies:
    - dataverse
    - httr
    - tidyverse
    - haven
    - estimatr
    - table1
    - ggpubr
    - knitr
    - readr
    - broom

dataverse:
  doi: https://doi.org/10.7910/DVN/WJQITU
  server: dataverse.harvard.edu
  dataset: "10.7910/DVN/WJQITU"
  # Pattern B surgical: one analysis CSV (not full archive zip)
  file_id: "14008582"
  original: true
  # https://dataverse.harvard.edu/api/access/datafile/14008582?format=original

steps:
  - id: access_data
    type: transform
    label: Access analysis data from Dataverse
    description: >
      Surgical download of final_data.csv (file 14008582, format=original)
      into outputs/ — not a full DVN zip.
    engine: dataverse
    file_id: "14008582"
    original: true
    code: code/steps/access_data.R
    outputs:
      - outputs/final_data.csv

  - id: prep_analysis_data
    type: transform
    label: Load and prepare analysis dataset
    parents:
      - access_data
    inputs:
      - outputs/final_data.csv
    outputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/steps/prep_analysis_data.R

  - id: tab_3a
    type: table
    label: Table 3a — Summary statistics, Deportation vignette
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/tables/tab_3a.R
    format: format_tab_3a
    outputs:
      - outputs/tab_3a.html

  - id: tab_3a_format
    type: format
    parent: tab_3a
    code: code/tables/tab_3a.R

  - id: tab_3b
    type: table
    label: Table 3b — Summary statistics, Quran burning and Eviction vignettes
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/tables/tab_3b.R
    format: format_tab_3b
    outputs:
      - outputs/tab_3b.html

  - id: tab_3b_format
    type: format
    parent: tab_3b
    code: code/tables/tab_3b.R

  - id: fig_1
    type: figure
    label: Figure 1 — Treatment summaries
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/figures/fig_1.R
    outputs:
      - outputs/fig_1.png

  - id: fig_2a
    type: figure
    label: Figure 2a — Effect of EC disagreeing with domestic court (H1)
