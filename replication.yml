maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

collections:
  - APSR

languages:
  - r

repo: replicate-anything/rep-10.1017-s0003055421001143

paper:
  doi: https://doi.org/10.1017/S0003055421001143
  title: "Sovereignty, Substance, and Public Support for European Courts' Human Rights Rulings"
  authors:
    - Mikael Rask Madsen
    - Juan Mayoral
    - Anton Strezhnev
    - Erik Voeten
  journal: American Political Science Review
  year: 2021
  study_folder: rep-10.1017-s0003055421001143
  dependencies:
    - dataverse
    - httr
    - tidyverse
    - haven
    - estimatr
    - table1
    - ggpubr
    - knitr
    - readr
    - broom

dataverse:
  doi: https://doi.org/10.7910/DVN/WJQITU
  server: dataverse.harvard.edu
  dataset: "10.7910/DVN/WJQITU"
  fetch: archive_original
  manifest: manifest/dataverse_files.csv
  deposit_root: outputs/deposit

steps:
  - id: access_deposit
    type: transform
    label: Download Dataverse deposit
    engine: r
    code: code/steps/access_deposit.R
    outputs:
      - outputs/deposit/.manifest_applied

  - id: prep_analysis_data
    type: transform
    label: Load and prepare analysis dataset
    parents:
      - access_deposit
    inputs:
      - outputs/deposit/Data/final_data.csv
    outputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/steps/prep_analysis_data.R

  - id: tab_3a
    type: table
    label: Table 3a — Summary statistics, Deportation vignette
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/tables/tab_3a.R
    format: format_tab_3a
    outputs:
      - outputs/tab_3a.html

  - id: tab_3a_format
    type: format
    parent: tab_3a
    code: code/tables/tab_3a.R

  - id: tab_3b
    type: table
    label: Table 3b — Summary statistics, Quran burning and Eviction vignettes
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/tables/tab_3b.R
    format: format_tab_3b
    outputs:
      - outputs/tab_3b.html

  - id: tab_3b_format
    type: format
    parent: tab_3b
    code: code/tables/tab_3b.R

  - id: fig_1
    type: figure
    label: Figure 1 — Treatment summaries
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/figures/fig_1.R
    outputs:
      - outputs/fig_1.png

  - id: fig_2a
    type: figure
    label: Figure 2a — Effect of EC disagreeing with domestic court (H1)
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/figures/fig_2a.R
    outputs:
      - outputs/fig_2a.png

  - id: fig_2b
    type: figure
    label: Figure 2b — Effect of EC disagreeing with domestic court, by country
    parents:
      - prep_analysis_data
    inputs:
      - outputs/prep_analysis_data/analysis_data.rds
    engine: r
    code: code/figures/fig_2b.R
    outputs:
      - outputs/fig_2b.png

  - id: fig_2c
    type: figure
